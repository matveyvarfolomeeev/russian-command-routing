[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-launcher"
version = "0.1.0"
description = "A modular Windows launcher and a catalog for decision-model experiments"
requires-python = ">=3.12"
dependencies = ["PySide6==6.11.2"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pyinstaller==6.22.3", "ruff==0.16.10"]

[project.gui-scripts]
jev-launcher = "jev_launcher.app:main"

[project.scripts]
jev-catalog = "jev_launcher.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jev_launcher = ["ui/*.qml", "resources/*.json", "resources/*.svg", "resources/*.ico", "resources/*.ps1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
