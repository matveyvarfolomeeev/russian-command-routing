name: Research checks

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  evidence:
    name: Public evidence, no model downloads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/verify_public_results.py
      - run: python scripts/training_dataset.py validate
      - run: python scripts/stt_training_dataset.py validate
      - run: python scripts/independent_dataset.py validate --text-only --public-only
      - run: python scripts/asr_dataset.py validate --dataset data/benchmarks/launcher-asr-v1/synthetic --text-only

  tests:
    name: Windows application and training-contract tests
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - run: python -m pip install -r requirements-dev.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m ruff check src tests scripts
      - run: python -m pytest -q
